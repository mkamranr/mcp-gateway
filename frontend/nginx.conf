# Serves the console and proxies the API and MCP endpoint to gateway-api on the internal network.
# Runs as non-root (nginx-unprivileged) on port 8080. Terminate TLS here or at an upstream load balancer.
server_tokens off;
client_max_body_size 2m;

upstream gateway_api { server gateway-api:8080; keepalive 16; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # MCP streamable HTTP. Buffering is off so streamed responses are not delayed.
  location /mcp {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 330s;
  }

  location /health/ { proxy_pass http://gateway_api; access_log off; }

  location /assets/ { include /etc/nginx/snippets/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
  location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; try_files $uri /index.html; }
}
