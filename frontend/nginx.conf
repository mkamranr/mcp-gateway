# Serves the console and proxies the API and MCP endpoint to gateway-api on the internal network.
# Runs as non-root (nginx-unprivileged) on port 8080. Terminate TLS here or at an upstream load balancer.
server_tokens off;
client_max_body_size 2m;

# >>> upstream: Docker Compose (the Helm chart has its own; .github/scripts/check_nginx_sync.py)
# Docker's embedded DNS. "resolve" re-resolves gateway-api every 10 s, so scaled-out, restarted or replaced
# replicas are picked up without reloading nginx (open-source nginx 1.27.3+). Requests are spread over all
# replicas; one that refuses connections or times out is skipped for 10 s.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

upstream gateway_api {
  zone gateway_api 64k;
  server gateway-api:8080 resolve max_fails=1 fail_timeout=10s;
  keepalive 16;
}
# <<< upstream

# Fail over to another replica when one is down. nginx never re-sends a non-idempotent request (POST, e.g. a
# tool invocation) once it reached a replica, so a call can't run twice; a refused connection is retried.
proxy_next_upstream error timeout http_502 http_503;
# Replicas are on the local Docker network: connecting takes milliseconds. A replica that was stopped can stay in
# the resolved list for up to 10 s, and connecting to its vanished address hangs instead of being refused, so give
# up after 3 s and move to the next replica (the default would be 60 s).
proxy_connect_timeout 3s;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 10s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Client-Cert "";  # never forward a client-supplied certificate header (docs/mtls.md)
    proxy_read_timeout 120s;
  }

  # MCP streamable HTTP. Buffering is off so streamed responses are not delayed.
  location /mcp {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Client-Cert "";
    proxy_buffering off;
    proxy_read_timeout 330s;
  }

  # OAuth protected resource metadata for MCP clients (RFC 9728, docs/agent-oauth.md). Public; no credentials.
  location /.well-known/oauth-protected-resource {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
  }

  location /health/ { proxy_pass http://gateway_api; access_log off; }

  location /assets/ { include /etc/nginx/snippets/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
  location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store" always; try_files $uri /index.html; }
}

# Optional agent mTLS listener: mount a server block (deploy/mtls/agent-mtls.conf) and its certificates into
# /etc/nginx/mtls/. Nothing is mounted by default, and an include that matches no file is not an error.
include /etc/nginx/mtls/*.conf;
