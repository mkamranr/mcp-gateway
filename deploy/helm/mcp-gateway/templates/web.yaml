{{- $full := include "mgw.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-web
  labels: {{- include "mgw.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels: {{- include "mgw.selector" (list . "web") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "mgw.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "mgw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "mgw.imagePullSecrets" . | nindent 6 }}
      securityContext: {{- include "mgw.podSecurity" (list 101 101) | nindent 8 }}
      {{- include "mgw.affinity" (list . "web" .Values.web.affinity) | nindent 6 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "mgw.image" (list . .Values.image.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "mgw.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
            {{- if .Values.mtls.enabled }}
            - { name: mtls, containerPort: 8443, protocol: TCP }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          lifecycle:
            preStop: { exec: { command: ["sleep", "5"] } }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.mtls.enabled }}
            - { name: mtls, mountPath: /etc/nginx/mtls, readOnly: true }
            {{- end }}
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: conf
          configMap: { name: {{ $full }}-nginx }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
        {{- if .Values.mtls.enabled }}
        - name: mtls
          projected:
            defaultMode: 0440
            sources:
              - configMap: { name: {{ $full }}-nginx-mtls }
              - secret:
                  name: {{ .Values.mtls.existingSecret }}
                  items:
                    - { key: server.crt, path: server.crt }
                    - { key: server.key, path: server.key }
                    - { key: agent-ca.pem, path: agent-ca.pem }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-web
  labels: {{- include "mgw.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  selector: {{- include "mgw.selector" (list . "web") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.web.service.port }}, targetPort: http, protocol: TCP }
{{- if .Values.mtls.enabled }}
---
# Agent mTLS: TCP straight to nginx, which does the TLS handshake and checks the client certificate.
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-mtls
  labels: {{- include "mgw.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.mtls.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mtls.service.type }}
  selector: {{- include "mgw.selector" (list . "web") | nindent 4 }}
  ports:
    - { name: mtls, port: {{ .Values.mtls.service.port }}, targetPort: mtls, protocol: TCP }
{{- end }}
{{- if .Values.web.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-web
  labels: {{- include "mgw.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "mgw.selector" (list . "web") | nindent 6 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels: {{- include "mgw.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-web
                port: { name: http }
{{- end }}
