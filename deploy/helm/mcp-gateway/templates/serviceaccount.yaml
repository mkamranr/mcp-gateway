{{- if .Values.serviceAccount.create }}
# The gateway never calls the Kubernetes API; tokens are not mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mgw.serviceAccountName" . }}
  labels: {{- include "mgw.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
