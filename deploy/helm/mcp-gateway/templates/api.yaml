{{- $full := include "mgw.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-api
  labels: {{- include "mgw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "mgw.selector" (list . "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "mgw.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "mgw.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "mgw.imagePullSecrets" . | nindent 6 }}
      securityContext: {{- include "mgw.podSecurity" (list 10001 10001) | nindent 8 }}
      {{- include "mgw.affinity" (list . "api" .Values.api.affinity) | nindent 6 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: {{ include "mgw.image" (list . .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "mgw.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          envFrom:
            - configMapRef: { name: {{ $full }}-config }
          env:
            {{- include "mgw.backendEnv" . | nindent 12 }}
            {{- with .Values.api.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          volumeMounts:
            {{- include "mgw.backendMounts" . | nindent 12 }}
            {{- with .Values.api.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Let endpoints and the web UI drop this pod before it stops accepting connections.
            preStop: { exec: { command: ["python", "-c", "import time; time.sleep(5)"] } }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- include "mgw.backendVolumes" . | nindent 8 }}
        {{- with .Values.api.extraVolumes }}{{ toYaml . | nindent 8 }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-api
  labels: {{- include "mgw.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector: {{- include "mgw.selector" (list . "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-api
  labels: {{- include "mgw.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "mgw.selector" (list . "api") | nindent 6 }}
{{- end }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $full }}-api
  labels: {{- include "mgw.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $full }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
