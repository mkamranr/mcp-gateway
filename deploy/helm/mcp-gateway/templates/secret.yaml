{{- include "mgw.validate" . -}}
{{- if and .Values.secrets.generate (not .Values.secrets.existingSecret) }}
{{- $name := include "mgw.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if $existing }}{{- $old = $existing.data }}{{- end }}
{{- $full := include "mgw.fullname" . }}
{{- $mongoPw := (get $old "mongo_root_password" | b64dec) | default (randAlphaNum 32) }}
{{- $redisPw := (get $old "redis_password" | b64dec) | default (randAlphaNum 32) }}
{{- /* AES-256 key: 32 random bytes, urlsafe base64 (as deploy/scripts/generate-secrets.sh) */}}
{{- $dek := (get $old "data_encryption_key" | b64dec) | default ((randAscii 32 | b64enc) | replace "+" "-" | replace "/" "_") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "mgw.labels" . | nindent 4 }}
  annotations:
    # Never deleted by helm uninstall: it holds the encryption key for data stored in MongoDB.
    helm.sh/resource-policy: keep
type: Opaque
data:
  session_secret: {{ (get $old "session_secret" | b64dec) | default (randAlphaNum 64) | b64enc }}
  data_encryption_key: {{ $dek | b64enc }}
  api_key_hash_pepper: {{ (get $old "api_key_hash_pepper" | b64dec) | default (randAlphaNum 64) | b64enc }}
  bootstrap_admin_password: {{ (get $old "bootstrap_admin_password" | b64dec) | default (randAlphaNum 24) | b64enc }}
  mongo_root_password: {{ $mongoPw | b64enc }}
  redis_password: {{ $redisPw | b64enc }}
  mongodb_uri: {{ printf "mongodb://mgw_root:%s@%s-mongodb:27017/?authSource=admin" $mongoPw $full | b64enc }}
  redis_url: {{ printf "redis://:%s@%s-redis:6379/0" $redisPw $full | b64enc }}
{{- end }}
