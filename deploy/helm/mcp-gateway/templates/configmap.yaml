apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mgw.fullname" . }}-config
  labels: {{- include "mgw.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{- if not (has $k (list "APP_ENV" "PUBLIC_BASE_URL")) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
  APP_ENV: production
  PUBLIC_BASE_URL: {{ include "mgw.publicBaseUrl" . | quote }}
  APP_VERSION: {{ .Chart.AppVersion | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mgw.fullname" . }}-nginx
  labels: {{- include "mgw.labels" . | nindent 4 }}
data:
  default.conf: |
{{ .Files.Get "files/nginx.conf" | replace "__API_SERVICE__" (printf "%s-api" (include "mgw.fullname" .)) | indent 4 }}
  {{- with .Values.web.realIpFrom }}
  realip.conf: |
    # Trust X-Forwarded-For from these proxies only, so the gateway sees the real client address.
    {{- range . }}
    set_real_ip_from {{ . }};
    {{- end }}
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
  {{- end }}
{{- if .Values.mtls.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mgw.fullname" . }}-nginx-mtls
  labels: {{- include "mgw.labels" . | nindent 4 }}
data:
  agent-mtls.conf: |
{{ .Files.Get "files/agent-mtls.conf" | indent 4 }}
{{- end }}
