# Agent mTLS listener for the bundled nginx (web-ui). See docs/mtls.md.
#
# Mount this file and its certificates read-only into the web-ui container at /etc/nginx/mtls/, publish port
# 8443, and set on gateway-api (and worker):
#   MTLS_CLIENT_CA_FILE=/run/secrets/agent_ca      the same CA bundle as ssl_client_certificate below
#   MTLS_TRUSTED_PROXIES=<web-ui's network>        only this proxy may forward a certificate
#
# The handshake proves the agent holds the private key of a certificate from the agent CA. nginx forwards the
# verified certificate to the gateway, which re-checks it and matches it to a certificate credential.
# Only the agent endpoints are served here: the console stays on the main listener.

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate         /etc/nginx/mtls/server.crt;   # this listener's own certificate
  ssl_certificate_key     /etc/nginx/mtls/server.key;   # readable by nginx (uid 101)
  ssl_protocols           TLSv1.2 TLSv1.3;
  ssl_session_cache       shared:mtls:10m;
  ssl_session_tickets     off;

  ssl_client_certificate  /etc/nginx/mtls/agent-ca.pem;  # CAs that issue agent certificates
  ssl_verify_client       on;                            # no certificate, no connection
  ssl_verify_depth        2;
  # ssl_crl               /etc/nginx/mtls/agent-ca.crl;  # revoke individual certificates (or revoke the
  #                                                      # credential in the console)

  include /etc/nginx/snippets/security-headers.conf;

  location /mcp {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $realip_remote_addr;  # the TCP peer: web.realIpFrom must not apply here
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";                         # this listener authenticates by certificate only
    proxy_set_header X-Client-Cert $ssl_client_escaped_cert;   # URL-escaped PEM, verified above
    proxy_buffering off;
    proxy_read_timeout 330s;
  }

  location /api/v1/gateway/ {
    proxy_pass http://gateway_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $realip_remote_addr;  # the TCP peer: web.realIpFrom must not apply here
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";
    proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    proxy_read_timeout 120s;
  }

  location / { return 404; }
}
